name: Parity memory experiment

on:
  push:
    branches: [ exp/parity-memory ]
  workflow_dispatch:

permissions: {}

jobs:
  parity:
    name: ${{ matrix.os }} probe=${{ matrix.probe }} rep=${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        probe: ['1', '0']
        rep: [1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PARITY_GPU_MEMORY_UTILIZATION: '0.65'
      GLOO_SOCKET_IFNAME: lo0
      MODEL_ID: Qwen/Qwen3.5-0.8B
      MODEL_REVISION: 2fc06364715b967f1860aea9cf38778875588b17
      VLLM_METAL_KV_COMMIT_PROBE: ${{ matrix.probe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: models
        with:
          path: ~/.cache/huggingface/hub
          key: parity-hf-${{ runner.os }}-qwen35-0.8b-2fc06364715b967f1860aea9cf38778875588b17
      - name: Install the tested checkout
        run: |
          mkdir -p "$RUNNER_TEMP/parity"
          ./install.sh
      - name: Prepare checkpoint
        run: |
          source .venv-vllm-metal/bin/activate
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          model = snapshot_download(os.environ["MODEL_ID"], revision=os.environ["MODEL_REVISION"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              print(f"MODEL_PATH={model}", file=f)
          PY
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: success() && steps.models.outputs.cache-hit != 'true' && matrix.rep == 1 && matrix.probe == '1'
        continue-on-error: true
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Memory before parity
        run: |
          sysctl -n hw.memsize
          vm_stat
          memory_pressure | tail -3
      - name: Compare parity through HTTP serving
        run: |
          source .venv-vllm-metal/bin/activate
          python tools/check_parity.py --model "$MODEL_PATH" --top-k 5 --max-tokens 20 \
            --batch-size 1 2 --output-dir "$RUNNER_TEMP/parity" \
            --gpu-memory-utilization "$PARITY_GPU_MEMORY_UTILIZATION"
      - name: Summarize
        if: always()
        run: |
          grep -hE "KV commit probe|sized down|Metal memory|not enough|ValueError" "$RUNNER_TEMP/parity/serve.log" || true
          cat "$RUNNER_TEMP/parity/summary.md" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: exp-${{ matrix.os }}-probe${{ matrix.probe }}-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/parity
          retention-days: 7
